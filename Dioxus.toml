[application]

# Web `build` & `serve` dist path
out_dir = "dist"

# resource (static) file folder
asset_dir = "public"

[web.wasm_opt]
# The level wasm-opt should target. z is the smallest. 4 is the fastest.
level = "4"

[web.app]

# HTML title tag content
title = "Parakeet | An attempt to implement Matrix as an RCS alternative"

[web.watcher]

index_on_404 = true

watch_path = ["src", "examples"]

[bundle]
# Bundle identifier
identifier = "im.polarys.parakeet"

# Bundle publisher
publisher = "parakeet"

# Bundle icon
icon = ["icons/icon.png"]

# Bundle resources
resources = ["public/*"]

# Bundle copyright
copyright = ""

# Bundle category
category = "Utility"

# Bundle short description
short_description = "An attempt to implement Matrix as an RCS alternative."

# Bundle long description
long_description = """
An attempt to implement Matrix as an RCS alternative by using matrix.org protocol by default and sms as fallback.
"""
